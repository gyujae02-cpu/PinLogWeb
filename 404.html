<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#061E33" />
  <meta name="robots" content="noindex" />
  <title>404 · PinLog</title>

  <!--
    GitHub Pages 가 없는 경로를 만나면 이 파일을 대신 내려준다.

    주의: 이 페이지는 /a/b/c 처럼 깊은 오타 주소에서도 뜬다.
    그래서 css/style.css 같은 상대경로를 걸면 그때 스타일이 통째로 깨진다.
    필요한 토큰과 규칙만 아래에 옮겨 적어 파일 하나로 완결시킨 이유다.
    같은 이유로 배경 영상도 /vid/... 처럼 루트 절대경로로 건다.
    (도메인 루트 배포 기준. 하위 경로에 올린다면 앞에 저장소 이름을 붙여야 한다.)
  -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

  <style>
    :root {
      --brand-200: #B8DEFF;
      --brand-500: #2E9BE6;
      --brand-600: #0B6FB5;
      --brand-rgb: 46, 155, 230;

      --ink-900: #16202B;
      --ink-500: #64748B;
      --ink-400: #94A3B8;
      --ink-rgb: 22, 32, 43;

      /* 로그인 화면과 같은 다크 글래스 토큰 */
      --login-deep: #061E33;
      --login-ink:  #FFFFFF;
      --login-dim:  rgba(255,255,255,.62);
      --login-mute: rgba(255,255,255,.42);
      --glass-bg:   rgba(255,255,255,.10);
      --glass-bd:   rgba(255,255,255,.20);

      --sh-glow: 0 14px 40px rgba(var(--brand-rgb), .32);
      --ease: cubic-bezier(.22, 1, .36, 1);

      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex; align-items: center; justify-content: center;
      padding:
        calc(28px + var(--safe-t)) calc(22px + var(--safe-r))
        calc(28px + var(--safe-b)) calc(22px + var(--safe-l));
      background: var(--login-deep);
      color: var(--login-ink);
      color-scheme: dark;
      font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    ::selection { background: var(--brand-200); color: var(--ink-900); }

    /* 배경 영상. 로그인 화면과 같은 소재를 쓴다.
       영상을 못 받거나 재생이 막히면 아래 그라디언트가 그대로 보인다.
       (원래 있던 지도 격자 무늬는 영상 위에서 잡음이라 걷어냈다.) */
    .bg {
      position: fixed; inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(118% 66% at 50% 60%, rgba(133,198,250,.50) 0%, rgba(133,198,250,0) 62%),
        linear-gradient(180deg,
          #072B4A 0%, #0B4A79 28%, #0B6FB5 48%,
          #0C4C7C 64%, #072B4A 82%, #061E33 100%);
    }
    .bg__video {
      position: absolute;
      top: 50%; left: 50%;
      width: 100%; height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      opacity: 0;
      transition: opacity .9s var(--ease);
    }
    .bg__video.is-ready { opacity: 1; }
    .bg__scrim {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg,
          rgba(6,20,34,.60) 0%, rgba(6,20,34,.24) 28%,
          rgba(6,20,34,.38) 58%, rgba(6,20,34,.76) 100%),
        radial-gradient(92% 62% at 50% 46%, rgba(6,20,34,0) 0%, rgba(6,20,34,.46) 100%),
        linear-gradient(0deg, rgba(11,111,181,.20), rgba(11,111,181,.20));
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 400px;
      margin: auto;
      text-align: center;
      animation: rise .8s var(--ease) both;
    }

    /* 로그인 카드와 같은 유리판. 값도 그대로 맞춘다. */
    .card {
      /* .pin 은 고정 폭 블록이라 text-align 으로는 가운데로 오지 않는다.
         .stage 와 같은 플렉스 정렬을 카드 안에도 준다. */
      display: flex; flex-direction: column; align-items: center;
      width: 100%;
      padding: 38px 28px 30px;
      border-radius: 28px;
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      border: 1px solid var(--glass-bd);
      box-shadow:
        0 30px 70px rgba(3, 14, 26, .45),
        0 1px 0 rgba(255,255,255,.26) inset;
    }
    @media (max-width: 639px) {
      .card { padding: 32px 20px 26px; border-radius: 24px; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }

    /* 핀은 꽂히지 못하고 지도 위에 떠 있다. 그림자만 아래에서 숨쉰다. */
    .pin {
      position: relative;
      width: 86px; height: 86px;
      margin-bottom: 26px;
    }
    .pin svg {
      display: block; width: 100%; height: 100%;
      filter: drop-shadow(0 10px 22px rgba(var(--brand-rgb), .28));
      animation: float 3.4s var(--ease) infinite;
    }
    .pin::after {
      content: '';
      position: absolute; left: 50%; bottom: -12px;
      width: 44px; height: 9px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(3, 14, 26, .45);
      filter: blur(4px);
      animation: shadow 3.4s var(--ease) infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(-5px); }
      50%      { transform: translateY(5px); }
    }
    @keyframes shadow {
      0%, 100% { opacity: .5; transform: translateX(-50%) scale(.86); }
      50%      { opacity: .9; transform: translateX(-50%) scale(1.06); }
    }

    .code {
      margin: 0;
      font-size: clamp(56px, 18vw, 72px);
      font-weight: 800; letter-spacing: -.05em; line-height: 1;
      color: var(--login-ink);
      text-shadow: 0 1px 2px rgba(3,14,26,.55), 0 2px 14px rgba(3,14,26,.28);
    }

    .title {
      margin: 14px 0 0;
      font-size: clamp(19px, 5.4vw, 22px);
      font-weight: 700; letter-spacing: -.03em; line-height: 1.35;
      color: var(--login-ink);
    }

    .desc {
      margin: 10px 0 0;
      font-size: 13.5px; font-weight: 500; letter-spacing: -.01em; line-height: 1.65;
      color: var(--login-dim);
    }

    .home {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 52px;
      margin-top: 30px;
      border-radius: 16px;
      background: linear-gradient(180deg, var(--brand-500), var(--brand-600));
      color: #fff;
      font-size: 15px; font-weight: 700; letter-spacing: -.01em;
      text-decoration: none;
      box-shadow:
        0 16px 36px rgba(3, 14, 26, .48),
        0 0 0 1px rgba(255,255,255,.14) inset;
      transition: transform .18s var(--ease), box-shadow .18s var(--ease), filter .18s var(--ease);
    }
    .home:hover { filter: brightness(1.06); }
    .home:active { transform: translateY(1px) scale(.99); box-shadow: 0 8px 22px rgba(var(--brand-rgb), .28); }
    .home:focus-visible { outline: 3px solid rgba(var(--brand-rgb), .45); outline-offset: 3px; }

    /* 로그인 화면과 같은 워드마크 — 'i' 자리를 핀이 대신한다. */
    .mark {
      margin: 44px 0 0;
      font-size: 17px; font-weight: 800; letter-spacing: -.035em; line-height: 1;
      color: var(--login-ink);
      user-select: none;
    }
    .mark em { font-style: normal; color: var(--brand-200); }
    /* 핀 기둥은 SVG 안에서 var(--ink-500) 을 쓴다. 지역 재정의로 밝게 바꾼다. */
    .wordmark-pin {
      display: inline-block;
      width: .39em; height: .78em;
      margin: 0 .04em;
      vertical-align: baseline;
      color: var(--brand-200);
      --ink-500: rgba(255,255,255,.72);
    }

    .copyright {
      margin: 12px 0 0;
      font-size: 11px; font-weight: 500; letter-spacing: .02em;
      color: rgba(255,255,255,.34);
      white-space: nowrap;
      user-select: none; pointer-events: none;
    }

    @media (max-height: 700px) {
      .pin { width: 68px; height: 68px; margin-bottom: 20px; }
      .home { margin-top: 24px; }
      .mark { margin-top: 30px; }
      .copyright { margin-top: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage { animation: none; }
      .pin svg, .pin::after { animation: none; }
      .bg__video { display: none; }
    }
  </style>
</head>

<body>

  <!-- 배경 영상. 로그인 화면과 같은 파일을 공유한다. -->
  <div class="bg" aria-hidden="true">
    <video id="bg-video" class="bg__video"
           autoplay muted loop playsinline preload="metadata" tabindex="-1">
      <source src="/vid/login-bg.mp4" type="video/mp4" />
    </video>
    <div class="bg__scrim"></div>
  </div>

  <main class="stage">

    <div class="card">

      <div class="pin" aria-hidden="true">
        <!-- favicon.svg 와 같은 핀. 기둥을 먼저 깔고 머리를 덮어야 윗부분이 공 뒤로 숨는다. -->
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="13.3" y="17" width="5.4" height="13" rx="2.7" fill="#D5E3F2"/>
          <circle cx="16" cy="11" r="9" fill="#52ADF2"/>
          <circle cx="12.6" cy="7.6" r="2.8" fill="#FFFFFF" fill-opacity=".3"/>
        </svg>
      </div>

      <p class="code">404</p>

      <h1 class="title">페이지를 찾을 수 없습니다</h1>

      <p class="desc">주소가 잘못 입력되었거나<br />삭제된 페이지일 수 있습니다.</p>

      <a class="home" href="/">지도로 돌아가기</a>

    </div><!-- /.card -->

    <p class="mark" aria-label="PinLog">P<svg class="wordmark-pin" viewBox="0 0 10 20" aria-hidden="true"><rect x="3.7" y="8" width="2.6" height="12" rx="1.3" fill="var(--ink-500)"/><circle cx="5" cy="5" r="5" fill="currentColor"/><circle cx="3.3" cy="3.3" r="1.6" fill="#fff" fill-opacity=".3"/></svg>n<em>Log</em></p>

    <p class="copyright">© 2026 JAEGYU LEE</p>
  </main>

  <script>
    // 데이터 절약 모드나 모션 최소화 설정이면 영상을 받지 않는다.
    // 어느 경우든 .bg 의 그라디언트가 그대로 보여 화면이 깨지지 않는다.
    (function () {
      var v = document.getElementById('bg-video');
      if (!v) return;
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var save = navigator.connection && navigator.connection.saveData;
      if (reduce || save) { v.remove(); return; }
      v.addEventListener('playing', function () { v.classList.add('is-ready'); }, { once: true });

      function tryPlay() { v.play().catch(function () {}); }
      tryPlay();

      // 숨겨진 탭에서 열렸거나 iOS 저전력 모드면 자동재생이 미뤄진다.
      // 화면이 보이는 시점에 한 번 더 시도한다. 끝내 막혀도 그라디언트가 남는다.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && v.paused) tryPlay();
      });
    })();
  </script>
</body>
</html>
